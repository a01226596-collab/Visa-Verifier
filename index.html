<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Application - Royal Oman Police</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #2b579a;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f9f9f9;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .captcha-img {
            background: #666;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            font-style: italic;
            letter-spacing: 3px;
            border-radius: 4px;
            user-select: none;
            text-decoration: line-through;
        }
        .search-btn {
            background-color: #1b365d;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-btn:hover {
            background-color: #132743;
        }
        /* Result Box Style */
        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .approved {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Track Your Application</h2>
        <form id="visaForm">
            <div class="form-group">
                <label>Visa Application Number (*)</label>
                <input type="text" id="appId" required>
            </div>
            <div class="form-group">
                <label>Travel Document Number (*)</label>
                <input type="text" id="passport" required>
            </div>
            <div class="form-group">
                <label>Document's Nationality (*)</label>
                <select id="nationality">
                    <option value="ETHIOPIA">ETHIOPIA</option>
                </select>
            </div>
            <div class="form-group">
                <label>Text Verification (*)</label>
                <div class="captcha-box">
                    <div class="captcha-img">6866</div>
                </div>
                <input type="text" id="captchaInput" required>
            </div>
            <button type="submit" class="search-btn">Search</button>
        </form>

        <div id="result-box"></div>
    </div>

    <script>
        document.getElementById('visaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const appId = document.getElementById('appId').value.trim();
            const passport = document.getElementById('passport').value.trim();
            const resultBox = document.getElementById('result-box');

            // ትክክለኛውን መረጃ ማረጋገጥ
            if (appId === '100066707335' && passport === 'E00865368') {
                resultBox.style.display = 'block';
                resultBox.className = 'approved';
                resultBox.innerHTML = 'Status: Approved! ✅ (Visa Granted)';
            } else {
                resultBox.style.display = 'block';
                resultBox.className = 'error';
                resultBox.innerHTML = 'Invalid Application Number or Passport Number.';
            }
        });
    </script>

</body>
</html>
