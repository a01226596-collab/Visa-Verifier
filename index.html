<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 20px auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a365d; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #1a365d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2c5282; }
        .result { margin-top: 25px; padding: 15px; border: 1px solid #cbd5e0; border-radius: 6px; display: none; background: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f7fafc; color: #2d3748; width: 40%; }
        .status-badge { padding: 4px 8px; background-color: #38a169; color: white; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .error { color: #e53e3e; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Client Visa Application Status</h2>
        <p class="subtitle">Enter your Visa or Passport Number to check your status</p>
        
        <form id="trackerForm">
            <div class="form-group">
                <label for="refNum">Visa or Passport Number:</label>
                <input type="text" id="refNum" required placeholder="e.g. 6712308 or EQ2320384">
            </div>
            <button type="submit">Search Status</button>
        </form>

        <div id="resultBox" class="result">
            <h3 style="margin-top: 0; color: #1a365d; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">Application Information</h3>
            <table>
                <tr><th>Full Name</th><td id="resName">-</td></tr>
                <tr><th>Passport Number</th><td id="resPassport">-</td></tr>
                <tr><th>Visa Number</th><td id="resVisaNum">-</td></tr>
                <tr><th>Visa Type</th><td id="resType">-</td></tr>
                <tr><th>Nationality</th><td id="resNation">-</td></tr>
                <tr><th>Date of Issue</th><td id="resIssue">-</td></tr>
                <tr><th>Valid Until</th><td id="resValid">-</td></tr>
                <tr><th>Status</th><td><span id="resStatus" class="status-badge">APPROVED</span></td></tr>
            </table>
        </div>
        
        <div id="errorBox" class="result error">
            No record found with this reference number. Please check and try again.
        </div>
    </div>

    <script>
        const visaDatabase = [
            { 
                visaNum: "1000271", 
                passport: "E00951317", 
                name: "ESMAEL TEMAM AMANO", 
                type: "Tourism Visa - Single Entry", 
                nation: "ETHIOPIA", 
                issue: "21/09/2026", 
                valid: "20/12/2026",
                status: "APPROVED" 
            }
        ];

        document.getElementById('trackerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('refNum').value.trim().toUpperCase();
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');

            const foundRecord = visaDatabase.find(item => item.visaNum === inputVal || item.passport.toUpperCase() === inputVal);

            if (foundRecord) {
                document.getElementById('resName').innerText = foundRecord.name;
                document.getElementById('resPassport').innerText = foundRecord.passport;
                document.getElementById('resVisaNum').innerText = foundRecord.visaNum;
                document.getElementById('resType').innerText = foundRecord.type;
                document.getElementById('resNation').innerText = foundRecord.nation;
                document.getElementById('resIssue').innerText = foundRecord.issue;
                document.getElementById('resValid').innerText = foundRecord.valid;
                document.getElementById('resStatus').innerText = foundRecord.status;
                
                resultBox.style.display = 'block';
                errorBox.style.display = 'none';
            } else {
                resultBox.style.display = 'none';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
